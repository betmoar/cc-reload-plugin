name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq

      # PINNED, not whatever ubuntu-latest ships: a newer shellcheck adds or
      # drops warnings, so an untouched tree goes red (or a real warning ships
      # green) on an image update. 0.10.0 is what tests/run-all.sh documents
      # for local use; the version is printed so a divergence shows in the log.
      - name: Shellcheck (pinned 0.10.0)
        run: |
          docker run --rm -v "$PWD":/w -w /w koalaman/shellcheck-alpine:v0.10.0 \
            sh -c 'shellcheck --version | grep version:; shellcheck -S warning hooks/*.sh scripts/*.sh tests/*.sh'

      # ONE gate, shared with local runs: JSON validity, bash -n, and every
      # tests/test-*.sh by GLOB — a new suite cannot be forgotten here, and
      # tests/test-release.sh asserts this file calls run-all.sh rather than a
      # hand-kept list. (run-all.sh also tries shellcheck and warns loudly when
      # it is absent; the pinned step above is the enforcing copy.)
      - name: Gates (tests/run-all.sh — same command as local)
        run: bash tests/run-all.sh
